# Copy these labels into the AvNav service when the service is already
# managed by another HaLOS Compose file.
labels:
  - traefik.enable=true
  - traefik.docker.network=halos-proxy-network
  - traefik.http.routers.app-4432.rule=Host(`avnav.example.invalid`)
  - traefik.http.routers.app-4432.entrypoints=websecure
  - traefik.http.routers.app-4432.tls=true
  - traefik.http.services.app-4432.loadbalancer.server.port=8083
